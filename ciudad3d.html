<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Río Gallegos en 3D</title>
  <meta name="theme-color" content="#14110d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    #cesium { position: fixed; inset: 0; }
    .cesium-viewer-bottom { bottom: 96px; }
    .arriba-izq { top: max(14px, env(safe-area-inset-top)); left: 14px; text-decoration: none; display: grid; place-items: center; }
  </style>
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/';</script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
</head>
<body class="app">
  <div id="cesium" aria-label="Vista 3D de Río Gallegos"></div>
  <a class="redondo arriba-izq" href="index.html" data-t-aria="vuelo.volver">✕</a>
  <button class="redondo arriba-der" id="btnMusica" data-t-aria="musica.apagar">🎵</button>

  <button class="tarjeta" id="tarjeta" hidden>
    <span class="tarjeta-portal" id="tarjetaFoto" aria-hidden="true"></span>
    <span class="tarjeta-texto">
      <small id="tarjetaArriba" data-t="vuelo.hacia">Volando hacia</small>
      <b id="tarjetaNombre"></b>
      <span id="tarjetaAbajo" data-t="vuelo.pausar">Tocá para pausar</span>
    </span>
    <span class="tarjeta-ir" aria-hidden="true" id="tarjetaIcono">⏸</span>
  </button>

  <section class="inicio" id="inicio">
    <div class="inicio-fondo">
      <img src="assets/fotos/actuales/ria-marea-baja.jpg" alt="">
      <img class="antes" src="assets/fotos/historicas/muelle-ycf-1957.jpg" alt="">
    </div>
    <div class="inicio-contenido">
      <div class="inicio-anillo" aria-hidden="true"></div>
      <h1 data-t="vuelo.h1">Río Gallegos desde el cielo</h1>
      <p data-t="vuelo.texto">Un vuelo por la ciudad, la ría, Laguna Azul y Cabo Vírgenes. En cada lugar se abre un portal al pasado.</p>
      <button class="btn grande" id="btnVolar" data-t="vuelo.volar">Volar</button>
      <a class="inicio-link" href="index.html" data-t="vuelo.aPie">o volvé al paseo a pie</a>
    </div>
  </section>

  <script type="module" src="modules/ciudad3d.js"></script>
</body>
</html>
