<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ciudad 3D</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { display: flex; flex-direction: column; height: 100dvh; }
    #cesium { flex: 1; min-height: 0; position: relative; }
    .controles { position: fixed; left: 12px; right: 12px; bottom: 20px; z-index: 1200; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
    .controles > * { pointer-events: auto; }
    .aviso3d { position: fixed; top: 112px; left: 50%; transform: translateX(-50%); z-index: 1100; background: var(--surface); color: var(--text); padding: 8px 14px; border-radius: 12px; box-shadow: var(--shadow); font-size: .88rem; max-width: calc(100vw - 32px); text-align: center; }
    .cesium-viewer-bottom { bottom: 70px; }
  </style>
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/';</script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Volver">‹</a>
    <h1>Ciudad 3D</h1>
    <button class="btn small sec" id="btnCapa" hidden>Cambiar vista</button>
  </header>
  <nav class="chips" id="chips"></nav>
  <div id="cesium"></div>
  <div class="aviso3d" id="aviso" hidden></div>
  <div class="controles">
    <button class="btn" id="btnTour">▶ Recorrido guiado</button>
    <button class="btn sec" id="btnInicio" style="background: var(--surface)">🏠</button>
  </div>
  <script type="module" src="modules/ciudad3d.js"></script>
</body>
</html>
