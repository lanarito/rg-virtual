<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Río Gallegos Inmersivo</title>
  <meta name="description" content="Paseo por Río Gallegos con portales al pasado: llegás a un lugar histórico y ves cómo era hace más de cien años.">
  <meta name="theme-color" content="#14110d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
  <div id="mapa" data-t-aria="mapa.aria"></div>

  <button class="redondo arriba-der" id="btnMusica" data-t-aria="musica.apagar">🎵</button>

  <button class="tarjeta" id="tarjeta" hidden>
    <span class="tarjeta-portal" id="tarjetaFoto" aria-hidden="true"></span>
    <span class="tarjeta-texto">
      <small id="tarjetaArriba">Portal más cercano</small>
      <b id="tarjetaNombre"></b>
      <span id="tarjetaAbajo"></span>
    </span>
    <span class="tarjeta-ir" aria-hidden="true">›</span>
  </button>

  <section class="inicio" id="inicio">
    <div class="inicio-fondo">
      <img src="assets/fotos/actuales/centro.jpg" alt="">
      <img class="antes" src="assets/fotos/historicas/tehuelches-25-mayo-1900.jpg" alt="">
    </div>
    <div class="inicio-contenido">
      <div class="escudo3d">
        <div class="escudo-moneda">
          <img src="assets/marca/escudo-rio-gallegos.png" alt="Municipalidad de Río Gallegos">
          <span class="escudo-brillo" aria-hidden="true"></span>
        </div>
      </div>
      <h1>Río Gallegos</h1>
      <p class="inicio-sub" data-t="inicio.sub">Un paseo con portales al pasado</p>
      <p data-t="inicio.texto">Caminá por la ciudad. Cuando llegues a un lugar histórico se abre un portal, y vas a ver cómo era hace más de cien años.</p>
      <div class="idiomas" id="idiomas" role="group" aria-label="Idioma / Language / Idioma"></div>
      <button class="btn grande" id="btnEmpezar" data-t="inicio.empezar">Empezar</button>
      <a class="inicio-link" href="ciudad3d.html" data-t="inicio.3d">o volá sobre la ciudad en 3D</a>
      <a class="inicio-ajustes" href="config.html" data-t="inicio.ajustes">Ajustes</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="modules/app.js"></script>
</body>
</html>
